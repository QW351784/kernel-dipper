name: build-dipper

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  KERNEL_REPO: https://github.com/aosp-mirror/kernel_common.git
  KERNEL_BRANCH: android17-6.18
  MR_DIFF: https://gitlab.com/sdm845-mainline/linux/-/merge_requests/102.diff
  DEVICE_DTB: qcom/sdm845-xiaomi-mi8-dipper.dtb

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout repo (patch payload)
        uses: actions/checkout@v4

      - name: Setup base package
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential flex bison bc libssl-dev libelf-dev \
            device-tree-compiler python3 zstd rsync gcc-aarch64-linux-gnu
          aarch64-linux-gnu-gcc --version | head -1
          nproc

      - name: Clone Android Common Kernel (android17-6.18)
        run: |
          git clone --depth=1 -b $KERNEL_BRANCH $KERNEL_REPO kernel
          cd kernel && git log -1 --oneline && sed -n '1,5p' Makefile

      - name: Apply dipper MR patch (DTS only)
        run: |
          curl -sSL "$MR_DIFF" -o /tmp/dipper.diff
          ls -l /tmp/dipper.diff
          cd kernel
          git apply --include='arch/arm64/boot/dts/qcom/*' \
                    --include='include/dt-bindings/*' \
                    /tmp/dipper.diff || echo "部分 DTS 补丁未应用（将由 overlay 覆盖）"
          git status --short | head -20

      - name: Overlay our fixed DTS/panel/headers
        run: |
          cp -v dts/*.dtsi dts/*.dts kernel/arch/arm64/boot/dts/qcom/
          mkdir -p kernel/include/dt-bindings/input kernel/include/dt-bindings/sound
          cp -v dt-bindings/input/*.h kernel/include/dt-bindings/input/ 2>/dev/null || true
          cp -v dt-bindings/sound/*.h kernel/include/dt-bindings/sound/ 2>/dev/null || true
          cp -v drivers/gpu/drm/panel/panel-samsung-ea8074.c kernel/drivers/gpu/drm/panel/
          grep -q "config DRM_PANEL_SAMSUNG_EA8074" kernel/drivers/gpu/drm/panel/Kconfig || \
            printf '\nconfig DRM_PANEL_SAMSUNG_EA8074\n\ttristate "Samsung EA8074 MIPI-DSI panel"\n\tdepends on DRM\n\thelp\n\t  Samsung EA8074 AMOLED panel, used on Xiaomi Mi 8 (dipper).\n' >> kernel/drivers/gpu/drm/panel/Kconfig
          grep -q "DRM_PANEL_SAMSUNG_EA8074" kernel/drivers/gpu/drm/panel/Makefile || \
            echo 'obj-$(CONFIG_DRM_PANEL_SAMSUNG_EA8074) += panel-samsung-ea8074.o' >> kernel/drivers/gpu/drm/panel/Makefile
          # 相机：IMX363（6.18 上游没有，用 mainline 版驱动）
          cp -v drivers/media/i2c/imx363.c kernel/drivers/media/i2c/
          grep -q "config VIDEO_IMX363" kernel/drivers/media/i2c/Kconfig || \
            printf '\nconfig VIDEO_IMX363\n\ttristate "Sony IMX363 sensor support"\n\tselect V4L2_CCI_I2C\n\thelp\n\t  Sony IMX363 12MP CMOS sensor for Xiaomi Mi 8 (dipper).\n' >> kernel/drivers/media/i2c/Kconfig
          grep -q "CONFIG_VIDEO_IMX363" kernel/drivers/media/i2c/Makefile || \
            echo 'obj-$(CONFIG_VIDEO_IMX363) += imx363.o' >> kernel/drivers/media/i2c/Makefile
          # 指纹：Goodix（platform bus）
          mkdir -p kernel/drivers/input/fingerprint
          cp -v drivers/input/fingerprint/*.c drivers/input/fingerprint/*.h \
                drivers/input/fingerprint/Kconfig drivers/input/fingerprint/Makefile \
                kernel/drivers/input/fingerprint/
          grep -q "drivers/input/fingerprint/Kconfig" kernel/drivers/input/Kconfig || \
            printf '\nsource "drivers/input/fingerprint/Kconfig"\n' >> kernel/drivers/input/Kconfig
          grep -q "fingerprint/" kernel/drivers/input/Makefile || \
            printf '\nobj-y += fingerprint/\n' >> kernel/drivers/input/Makefile
          grep -q "sdm845-xiaomi-mi8-dipper.dtb" kernel/arch/arm64/boot/dts/qcom/Makefile && echo "dtb 已注册" || \
            echo 'dtb-$(CONFIG_ARCH_QCOM) += sdm845-xiaomi-mi8-dipper.dtb' >> kernel/arch/arm64/boot/dts/qcom/Makefile
          # ION：兼容层（DMA-BUF 后端），给老 gralloc / QSEECom 用
          cp -v uapi/ion.h kernel/include/uapi/linux/ion.h
          cp -v drivers/misc/ion_compat.c kernel/drivers/misc/ion_compat.c
          grep -q "config ION_COMPAT" kernel/drivers/misc/Kconfig || \
            printf '\nconfig ION_COMPAT\n\ttristate "ION compatibility shim over DMA-BUF"\n\tdepends on DMA_SHARED_BUFFER\n\thelp\n\t  Recreates legacy /dev/ion on top of DMA-BUF.\n' >> kernel/drivers/misc/Kconfig
          grep -q "CONFIG_ION_COMPAT" kernel/drivers/misc/Makefile || \
            printf '\nobj-$(CONFIG_ION_COMPAT) += ion_compat.o\n' >> kernel/drivers/misc/Makefile
          # 电量计：PMI8998 FG（6.18 主线不认 qcom,pmi8998-fg，用 sdm845 社区补丁的驱动）
          cp -v drivers/power/supply/pmi8998_fg.c kernel/drivers/power/supply/
          grep -q "config BATTERY_PMI8998_FG" kernel/drivers/power/supply/Kconfig || \
            printf '\nconfig BATTERY_PMI8998_FG\n\ttristate "Qualcomm PMI8998 PMIC fuel gauge driver"\n\tdepends on MFD_SPMI_PMIC\n\thelp\n\t  PMI8998 fuel gauge on Xiaomi Mi 8 (dipper).\n' >> kernel/drivers/power/supply/Kconfig
          grep -q "BATTERY_PMI8998_FG" kernel/drivers/power/supply/Makefile || \
            echo 'obj-$(CONFIG_BATTERY_PMI8998_FG) += pmi8998_fg.o' >> kernel/drivers/power/supply/Makefile
          # 传感器：BMP285 气压计（主线 bmp280 驱动只认 bmp280，BMP285 寄存器兼容，补一条 ID）
          python3 - <<'PY'
          p = 'kernel/drivers/iio/pressure/bmp280-i2c.c'
          s = open(p, encoding='utf-8').read()
          if 'bosch,bmp285' not in s:
              old = '{ .compatible = "bosch,bmp280", .data = &bmp280_chip_info },'
              new = old + '\n\t{ .compatible = "bosch,bmp285", .data = &bmp280_chip_info },'
              if old in s:
                  s = s.replace(old, new, 1)
                  open(p, 'w', encoding='utf-8').write(s)
                  print('bmp285: of_match id added')
              else:
                  print('WARNING: bmp280 of_match not found')
          PY

      - name: Patch q6v5 to wait for /vendor
        run: |
          python3 - <<'PY'
          p = 'kernel/drivers/remoteproc/qcom_q6v5_mss.c'
          s = open(p, encoding='utf-8').read()
          if 'mi8_vendor_wait' not in s:
              needle = 'static int q6v5_probe(struct platform_device *pdev)\n{'
              if needle in s:
                  s = s.replace(needle, needle + '\n\t/* MI8: /vendor 挂载晚于内置驱动 probe，等挂好再取固件 */\n\t/* mi8_vendor_wait */\n\tmsleep(20000);\n', 1)
                  open(p, 'w', encoding='utf-8').write(s)
                  print('patched: 20s wait in q6v5_probe')
              else:
                  print('WARNING: q6v5_probe not found')
          PY
          grep -n -A3 'mi8_vendor_wait' kernel/drivers/remoteproc/qcom_q6v5_mss.c || echo "未打上"

      - name: Configure kernel
        run: |
          cd kernel
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          ./scripts/config --file .config \
            --enable TOUCHSCREEN_STMFTS \
            --enable EROFS_FS \
            --enable EROFS_FS_ZIP \
            --enable ANDROID_BINDER_IPC \
            --enable ANDROID_BINDERFS \
            --enable DM_VERITY \
            --enable DMABUF_HEAPS \
            --enable DMABUF_HEAPS_SYSTEM \
            --enable QCOM_SMBB \
            --enable QCOM_TSENS \
            --enable QCOM_WDT \
            --enable CFG80211 \
            --enable MAC80211 \
            --enable ATH10K \
            --enable ATH10K_SNOC \
            --enable QCOM_Q6V5_MSS \
            --enable QCOM_Q6V5_PAS \
            --enable QCOM_PIL_INFO \
            --enable QCOM_SYSMON \
            --enable QCOM_APCS_IPC \
            --enable SPMI_PMIC_ARB \
            --enable CHARGER_QCOM_SMB2 \
            --enable POWER_SUPPLY \
            --enable MFD_SPMI_PMIC \
            --enable IIO \
            --enable BATTERY_PMI8998_FG \
            --enable INV_MPU6050_I2C \
            --enable INV_MPU6050 \
            --enable IIO_BUFFER \
            --enable IIO_TRIGGERED_BUFFER \
            --enable AK8975 \
            --enable BMP280 \
            --enable BMP280_I2C \
            --enable REGULATOR_QCOM_SPMI \
            --enable QCOM_RPMH \
            --enable ARM_QCOM_CPUFREQ_HW \
            --enable VIDEO_IMX363 \
            --enable DRM_PANEL_SAMSUNG_EA8074 \
            --enable REGULATOR_QCOM_LABIBB \
            --enable DMABUF_HEAPS_CMA \
            --enable DRM \
            --enable QCOM_OCMEM \
            --enable QCOM_LLCC \
            --enable RPMSG_QCOM_GLINK_SMEM \
            --enable DRM_MSM \
            --enable DRM_MSM_DSI \
            --enable DRM_MSM_DPU \
            --enable SCSI_UFS_QCOM \
            --enable PHY_QCOM_QMP \
            --enable QCOM_Q6V5_PAS \
            --enable QCOM_Q6V5_MSS \
            --enable SOUND \
            --enable SND \
            --enable SND_SOC \
            --enable SND_SOC_QCOM \
            --enable SND_SOC_SDM845 \
            --enable SND_SOC_WCD934X \
            --enable SND_SOC_QDSP6 \
            --enable SND_SOC_MSM8916_WCD_DIGITAL \
            --enable QCOM_APR \
            --enable SLIMBUS \
            --enable MFD_WCD934X \
            --enable SOUNDWIRE \
            --enable QCOM_IPA \
            --enable RMNET \
            --enable QCOM_RPROC_COMMON \
            --enable NET_DEVLINK \
            --enable RFKILL \
            --enable CFG80211 \
            --enable MAC80211 \
            --enable BT \
            --enable BT_QCA \
            --enable BT_HCIUART \
            --enable BT_HCIUART_QCA \
            --enable ATH10K \
            --enable ATH10K_PCI \
            --enable ATH10K_SNOC \
            --enable NVMEM \
            --enable POWER_SEQUENCING \
            --enable SERIAL_DEV_BUS \
            --enable MEDIA_SUPPORT \
            --enable VIDEO_DEV \
            --enable VIDEO_QCOM_CAMSS \
            --enable V4L2_CCI_I2C \
            --enable INPUT_FINGERPRINT \
            --enable FINGERPRINT_GOODIX_TA \
            --enable ION_COMPAT \
            --set-str LOCALVERSION "-MI8-ACK618"
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          echo "=== 关键配置确认 ==="
          grep -E "^(CONFIG_(CHARGER_QCOM_SMB2|BATTERY_PMI8998_FG|POWER_SUPPLY|MFD_SPMI_PMIC|IIO|TOUCHSCREEN_STMFTS|EROFS_FS|ANDROID_BINDERFS|ANDROID_BINDER_IPC|DM_VERITY|ATH10K|QCOM_Q6V5_MSS|QCOM_SMBB|LOCALVERSION|DRM_PANEL_SAMSUNG_EA8074|REGULATOR_QCOM_LABIBB|VIDEO_IMX363|DMABUF_HEAPS|DMABUF_HEAPS_CMA|ION_COMPAT|INPUT_FINGERPRINT)=|# CONFIG_(DRM_PANEL_SAMSUNG_EA8074|REGULATOR_QCOM_LABIBB|VIDEO_IMX363) is not set)" .config
          echo "=== 音频/蓝牙/WiFi 全链 ==="
          grep -E "^CONFIG_(SOUND|SND|SND_SOC|SND_SOC_SDM845|SND_SOC_QDSP6|SND_SOC_WCD934X|QCOM_APR|SLIMBUS|MFD_WCD934X|SOUNDWIRE|BT|BT_QCA|BT_HCIUART|BT_HCIUART_QCA|ATH10K|ATH10K_PCI|MAC80211|CFG80211)=" .config
          echo "=== 显示/存储/远程处理器 ==="
          grep -E "^CONFIG_(DRM|DRM_MSM|DRM_MSM_DSI|DRM_MSM_DPU|SCSI_UFS_QCOM|PHY_QCOM_QMP|QCOM_Q6V5_PAS|QCOM_Q6V5_MSS|VIDEO_QCOM_CAMSS|VIDEO_IMX363)=" .config
          echo "=== 基带链路 ==="
          grep -E "^CONFIG_(QCOM_Q6V5_MSS|QCOM_Q6V5_COMMON|QCOM_RPROC_COMMON|QCOM_IPA|RMNET|QCOM_QMI_HELPERS|QCOM_MDT_LOADER|QCOM_SCM|QCOM_SMEM|RPMSG_QCOM_SMD|QCOM_IOMMU|ARM_SMMU)=" .config

      - name: Build Image
        run: |
          cd kernel
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- Image -j$(nproc) 2>&1 | tee /tmp/build.log | tail -30
          ls -la arch/arm64/boot/Image

      - name: Build DTB
        run: |
          cd kernel
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- $DEVICE_DTB 2>&1 | tee /tmp/dtb.log | tail -20
          ls -la arch/arm64/boot/dts/qcom/sdm845-xiaomi-mi8-dipper.dtb

      - name: Verify artifacts
        run: |
          cd kernel
          file arch/arm64/boot/Image
          file arch/arm64/boot/dts/qcom/sdm845-xiaomi-mi8-dipper.dtb
          echo "=== Image 版本串 ==="
          strings arch/arm64/boot/Image 2>/dev/null | grep -m3 -E "6\.18" || true
          echo "=== Image 字节数 ==="
          stat -c %s arch/arm64/boot/Image
          echo "=== DTB 展开检查 ==="
          dtc -I dtb -O dts arch/arm64/boot/dts/qcom/sdm845-xiaomi-mi8-dipper.dtb 2>/dev/null > /tmp/mi8.dts
          grep -m2 -E 'model =' /tmp/mi8.dts
          echo -n "st,stmfts 触摸节点数: "; grep -c "st,stmfts" /tmp/mi8.dts
          echo -n "simple-battery 节点数: "; grep -c "simple-battery" /tmp/mi8.dts
          echo -n "disp_vddio_vreg 节点数: "; grep -c "disp_vddio_vreg" /tmp/mi8.dts
          echo -n "mss 固件名: "; grep -A2 "mss-pil" /tmp/mi8.dts | grep -m1 firmware-name || echo "未找到"
          echo -n "ipa 节点: "; grep -c "gsi-loader" /tmp/mi8.dts

      - name: Collect artifacts
        run: |
          cd kernel
          cp arch/arm64/boot/Image ../Image_out
          cp arch/arm64/boot/dts/qcom/sdm845-xiaomi-mi8-dipper.dtb ../mi8-dipper.dtb
          ls -la ../Image_out ../mi8-dipper.dtb

      - name: Upload Image + DTB
        uses: actions/upload-artifact@v4
        with:
          name: mi8-ack618-Image
          path: |
            Image_out
            mi8-dipper.dtb
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-fail
          path: |
            /tmp/build.log
            /tmp/dtb.log
          retention-days: 3
