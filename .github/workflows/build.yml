name: build-dipper

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  KERNEL_REPO: https://github.com/aosp-mirror/kernel_common.git
  KERNEL_BRANCH: android17-6.18
  MR_DIFF: https://gitlab.com/sdm845-mainline/linux/-/merge_requests/102.diff
  DEVICE_DTB: qcom/sdm845-xiaomi-mi8-dipper.dtb

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout repo (patch payload)
        uses: actions/checkout@v4

      - name: Setup base package
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential flex bison bc libssl-dev libelf-dev \
            device-tree-compiler python3 zstd rsync gcc-aarch64-linux-gnu
          aarch64-linux-gnu-gcc --version | head -1
          nproc

      - name: Clone Android Common Kernel (android17-6.18)
        run: |
          git clone --depth=1 -b $KERNEL_BRANCH $KERNEL_REPO kernel
          cd kernel && git log -1 --oneline && sed -n '1,5p' Makefile

      - name: Apply dipper MR patch (DTS only)
        run: |
          curl -sSL "$MR_DIFF" -o /tmp/dipper.diff
          ls -l /tmp/dipper.diff
          cd kernel
          git apply --include='arch/arm64/boot/dts/qcom/*' \
                    --include='include/dt-bindings/*' \
                    /tmp/dipper.diff || echo "部分 DTS 补丁未应用（将由 overlay 覆盖）"
          git status --short | head -20

      - name: Overlay our fixed DTS/panel/headers
        run: |
          cp -v dts/*.dtsi dts/*.dts kernel/arch/arm64/boot/dts/qcom/
          mkdir -p kernel/include/dt-bindings/input kernel/include/dt-bindings/sound
          cp -v dt-bindings/input/*.h kernel/include/dt-bindings/input/ 2>/dev/null || true
          cp -v dt-bindings/sound/*.h kernel/include/dt-bindings/sound/ 2>/dev/null || true
          cp -v drivers/gpu/drm/panel/panel-samsung-ea8074.c kernel/drivers/gpu/drm/panel/
          # 相机：IMX363（6.18 上游没有，用 mainline 版驱动）
          cp -v drivers/media/i2c/imx363.c kernel/drivers/media/i2c/
          grep -q "config VIDEO_IMX363" kernel/drivers/media/i2c/Kconfig || \
            printf '\nconfig VIDEO_IMX363\n\ttristate "Sony IMX363 sensor support"\n\tdepends on I2C && VIDEO_V4L2\n\tselect V4L2_CCI_I2C\n\thelp\n\t  Sony IMX363 12MP CMOS sensor (mainline v4l2-cci driver)\n' >> kernel/drivers/media/i2c/Kconfig
          grep -q "CONFIG_VIDEO_IMX363" kernel/drivers/media/i2c/Makefile || \
            echo 'obj-$(CONFIG_VIDEO_IMX363) += imx363.o' >> kernel/drivers/media/i2c/Makefile
          # 指纹：Goodix（platform bus）
          mkdir -p kernel/drivers/input/fingerprint
          cp -v drivers/input/fingerprint/*.c drivers/input/fingerprint/*.h \
                drivers/input/fingerprint/Kconfig drivers/input/fingerprint/Makefile \
                kernel/drivers/input/fingerprint/
          grep -q "drivers/input/fingerprint/Kconfig" kernel/drivers/input/Kconfig || \
            printf '\nsource "drivers/input/fingerprint/Kconfig"\n' >> kernel/drivers/input/Kconfig
          grep -q "fingerprint/" kernel/drivers/input/Makefile || \
            printf '\nobj-y += fingerprint/\n' >> kernel/drivers/input/Makefile
          grep -q "sdm845-xiaomi-mi8-dipper.dtb" kernel/arch/arm64/boot/dts/qcom/Makefile && echo "dtb 已注册" || \
            echo 'dtb-$(CONFIG_ARCH_QCOM) += sdm845-xiaomi-mi8-dipper.dtb' >> kernel/arch/arm64/boot/dts/qcom/Makefile
          # ION：兼容层（DMA-BUF 后端），给老 gralloc / QSEECom 用
          cp -v uapi/ion.h kernel/include/uapi/linux/ion.h
          cp -v drivers/misc/ion_compat.c kernel/drivers/misc/ion_compat.c
          grep -q "config ION_COMPAT" kernel/drivers/misc/Kconfig || \
            printf '\nconfig ION_COMPAT\n\ttristate "ION compatibility shim over DMA-BUF"\n\tdepends on DMA_SHARED_BUFFER\n\thelp\n\t  Recreates legacy /dev/ion on top of DMA-BUF.\n' >> kernel/drivers/misc/Kconfig
          grep -q "CONFIG_ION_COMPAT" kernel/drivers/misc/Makefile || \
            printf '\nobj-$(CONFIG_ION_COMPAT) += ion_compat.o\n' >> kernel/drivers/misc/Makefile

      - name: Configure kernel
        run: |
          cd kernel
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          ./scripts/config --file .config \
            --enable TOUCHSCREEN_STMFTS \
            --enable EROFS_FS \
            --enable EROFS_FS_ZIP \
            --enable ANDROID_BINDER_IPC \
            --enable ANDROID_BINDERFS \
            --enable DM_VERITY \
            --enable DMABUF_HEAPS \
            --enable DMABUF_HEAPS_SYSTEM \
            --enable QCOM_SMBB \
            --enable QCOM_TSENS \
            --enable QCOM_WDT \
            --enable CFG80211 \
            --enable MAC80211 \
            --enable ATH10K \
            --enable ATH10K_SNOC \
            --enable QCOM_Q6V5_MSS \
            --enable QCOM_Q6V5_PAS \
            --enable QCOM_PIL_INFO \
            --enable QCOM_SYSMON \
            --enable QCOM_APCS_IPC \
            --enable SPMI_PMIC_ARB \
            --enable REGULATOR_QCOM_SPMI \
            --enable QCOM_RPMH \
            --enable ARM_QCOM_CPUFREQ_HW \
            --enable VIDEO_IMX363 \
            --enable V4L2_CCI_I2C \
            --enable INPUT_FINGERPRINT \
            --enable FINGERPRINT_GOODIX_TA \
            --enable ION_COMPAT \
            --set-str LOCALVERSION "-MI8-ACK618"
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          echo "=== 关键配置确认 ==="
          grep -E "^CONFIG_(TOUCHSCREEN_STMFTS|EROFS_FS|ANDROID_BINDERFS|ANDROID_BINDER_IPC|DM_VERITY|ATH10K|QCOM_Q6V5_MSS|QCOM_SMBB|LOCALVERSION)=" .config

      - name: Build Image
        run: |
          cd kernel
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- Image -j$(nproc) 2>&1 | tee /tmp/build.log | tail -30
          ls -la arch/arm64/boot/Image

      - name: Build DTB
        run: |
          cd kernel
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- $DEVICE_DTB 2>&1 | tee /tmp/dtb.log | tail -20
          ls -la arch/arm64/boot/dts/qcom/sdm845-xiaomi-mi8-dipper.dtb

      - name: Verify artifacts
        run: |
          cd kernel
          file arch/arm64/boot/Image
          file arch/arm64/boot/dts/qcom/sdm845-xiaomi-mi8-dipper.dtb
          echo "=== Image 版本串 ==="
          strings arch/arm64/boot/Image 2>/dev/null | grep -m3 -E "6\.18" || true
          echo "=== Image 字节数 ==="
          stat -c %s arch/arm64/boot/Image
          echo "=== DTB 展开检查 ==="
          dtc -I dtb -O dts arch/arm64/boot/dts/qcom/sdm845-xiaomi-mi8-dipper.dtb 2>/dev/null > /tmp/mi8.dts
          grep -m2 -E 'model =' /tmp/mi8.dts
          echo -n "st,stmfts 触摸节点数: "; grep -c "st,stmfts" /tmp/mi8.dts
          echo -n "simple-battery 节点数: "; grep -c "simple-battery" /tmp/mi8.dts
          echo -n "disp_vddio_vreg 节点数: "; grep -c "disp_vddio_vreg" /tmp/mi8.dts

      - name: Collect artifacts
        run: |
          cd kernel
          cp arch/arm64/boot/Image ../Image_out
          cp arch/arm64/boot/dts/qcom/sdm845-xiaomi-mi8-dipper.dtb ../mi8-dipper.dtb
          ls -la ../Image_out ../mi8-dipper.dtb

      - name: Upload Image + DTB
        uses: actions/upload-artifact@v4
        with:
          name: mi8-ack618-Image
          path: |
            Image_out
            mi8-dipper.dtb
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-fail
          path: |
            /tmp/build.log
            /tmp/dtb.log
          retention-days: 3
